name: Add a verse

# Free, no AI, no password. Run it from the GitHub app on any phone:
# Actions → "Add a verse" → Run workflow → type the reference → Run.
#
# Only public-domain translations work here (WEB, KJV, ASV, YLT, BBE, DARBY).
# NKJV is copyrighted — post that one from /admin on the site instead.

on:
  workflow_dispatch:
    inputs:
      reference:
        description: 'Reference — e.g. John 3:16 or Psalm 23:1-3'
        required: true
        type: string
      date:
        description: 'Date YYYY-MM-DD. Leave blank for today (Asia/Kolkata).'
        required: false
        type: string
      version:
        description: 'Translation: WEB, KJV, ASV, YLT, BBE, DARBY'
        required: false
        default: WEB
        type: choice
        options:
          - WEB
          - KJV
          - ASV
          - YLT
          - BBE
          - DARBY
      note:
        description: 'Optional one-line reflection'
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: add-verse
  cancel-in-progress: false

jobs:
  add:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fetch and add the verse
        env:
          REFERENCE: ${{ inputs.reference }}
          DATE: ${{ inputs.date }}
          VERSION: ${{ inputs.version }}
          NOTE: ${{ inputs.note }}
        run: node scripts/add-verse.mjs

      - name: Commit the change
        run: |
          git config user.name "abidewell"
          git config user.email "actions@users.noreply.github.com"
          if git diff --quiet -- public/data/verses.json; then
            echo "Nothing changed — that verse was already there."
            exit 0
          fi
          git add public/data/verses.json
          git commit -m "verse: ${{ inputs.reference }}"
          git push
