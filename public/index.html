<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Abidewell — a verse for today</title>
  <meta name="description" content="One verse, set like a printed broadside. A new reading every day." />
  <meta name="theme-color" content="#ede4d3" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="icon" href="/assets/icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="/assets/icon-192.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Literata:opsz,wght@7..72,400;7..72,500;7..72,600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/assets/styles.css" />
</head>
<body>
  <div class="paper" aria-hidden="true"></div>
  <div class="burst" aria-hidden="true"></div>

  <nav class="rail rail--left" aria-label="Sections">
    <a class="rail-link is-current" href="/">Today</a>
    <span class="rail-dot" aria-hidden="true"></span>
    <a class="rail-link" href="/archive.html">Archive</a>
    <span class="rail-dot" aria-hidden="true"></span>
    <a class="rail-link" href="/devotional.html">Explore verse</a>
    <span class="rail-dot" aria-hidden="true"></span>
    <a class="rail-link" href="/admin.html">Post</a>
  </nav>

  <aside class="rail rail--right" aria-hidden="true">
    <span class="wordmark">Abidewell</span>
    <span class="rail-rule"></span>
    <span class="issue">No.&nbsp;<b id="issueNo">001</b></span>
  </aside>

  <main class="altar">
    <section class="halo" id="halo" aria-hidden="true">
      <div class="rings"></div>
      <div class="ticks" id="ticks"></div>
      <div class="halo-disc"></div>
    </section>

    <article class="reading" id="reading" aria-live="polite">
      <p class="eyebrow" id="verseMeta">—</p>

      <blockquote class="verse">
        <p class="verse-text" id="verseText"></p>
      </blockquote>

      <p class="citation">
        <span class="citation-ref" id="verseRef"></span>
        <span class="citation-rule" aria-hidden="true"></span>
        <span class="citation-version" id="verseVersion"></span>
      </p>

      <p class="whisper" id="whisper"></p>

      <p class="gloss" id="verseNote" hidden></p>
    </article>

    <section class="simplify" id="exploreBlock">
      <button class="simplify-toggle" id="exploreBtn" type="button" aria-expanded="false" aria-controls="explorePanel">
        <span class="simplify-mark" aria-hidden="true">✦</span>
        <span>Explore this verse</span>
        <span class="simplify-chevron" aria-hidden="true">+</span>
      </button>
      <div class="simplify-panel explore-panel" id="explorePanel" hidden></div>
    </section>

    <div class="instruments">
      <div class="instrument-pair">
        <button class="instrument" id="prevBtn" type="button">
          <span aria-hidden="true">←</span> earlier
        </button>
        <button class="instrument" id="nextBtn" type="button">
          later <span aria-hidden="true">→</span>
        </button>
      </div>

      <div class="instrument-pair">
        <button class="instrument instrument--amen" id="amenBtn" type="button">Amen</button>
        <button class="instrument" id="copyBtn" type="button">
          <span aria-hidden="true">⧉</span> copy
        </button>
        <button class="instrument" id="shareBtn" type="button">
          <span aria-hidden="true">↗</span> share
        </button>
      </div>
    </div>

    <p class="streak" id="streak" hidden>
      <span class="streak-word">Kept</span>
      <span class="streak-count" id="streakCount">1</span>
      <span class="streak-word" id="streakUnit">day</span>
      <span class="streak-marks" id="streakMarks" aria-hidden="true"></span>
    </p>

    <p class="colophon">Soli Deo gloria <span aria-hidden="true">·</span> <span id="colophonDate"></span></p>
  </main>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="/assets/config.js"></script>
  <script src="/assets/app.js" type="module"></script>
</body>
</html>
